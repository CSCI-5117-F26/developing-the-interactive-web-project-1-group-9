<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A survey landing page.">
    <title>Take Survey</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/purecss@3.1.0/build/pure-min.css"
        integrity="sha384-kj0X2NG2KHBie8Tq8fH1kxnyWM9XsXQpq7XdwbKmFKjwwaXGKBlB2Klu3VOltSFx" crossorigin="anonymous">
</head>

<body>

    <div class="splash-container">
        <div class="splash">
            <h1 class="splash-head">Login to highlight your sunshine</h1>
            <div>
                <form action="/feed">
                    <label for="username">Username</label>
                    <input id="username" name="username" type="text" />
                    <p></p>
                    <label for="password">Password</label>
                    <input id="password" name="password" type="text" />
                    <p></p>
                    <button class="pure-button pure-button-primary">Login</button>
                </form>
                <p></p>
                <form action="/signup">
                    <button class="pure-button pure-button-primary">Sign Up</button>
                </form>
            </div>
        </div>
    </div>



</body>

</html>
