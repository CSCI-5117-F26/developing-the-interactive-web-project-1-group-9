{% extends "base.html" %}

{% block title %}Feed{% endblock %}

{% block content %}

<div class="page feed">

    

    <!-- Feed -->
    <main>

        <!-- Create Post -->
        <section class="card">
            <form class="pure-form pure-form-stacked">

                <label for="post">Let's add some sunshine ☀️</label>

                <textarea id="post" name="post" rows="3" placeholder="What's making you happy today?"></textarea>

                <button type="submit" class="btn btn-primary">
                    Post
                </button>

            </form>
        </section>
        <!-- Recent Posts -->
        <section>
          
            <h3>Recent Posts</h3>
            {% for post in posts %}
            <article class="card post">
            
                <!-- Author -->
                <div class="post-header">
            
                    <div class="post-author">
            
                        <a href="/profile">
                            <img src="https://www.looper.com/img/gallery/the-untold-truth-of-bruce-wayne/bruce-wayne-is-actually-batmans-mask-1638569177.jpg" alt="John Doe"
                                class="post-avatar">
                        </a>
            
                        <div>
                            <strong>@{{ post[2] }}</strong>
                            <time datetime="2026-10-17">{{post[5]}}</time>
                        </div>
            
                    </div>
            
                    <a href="#" class="btn">Follow</a>
            
                </div>
            
                <!-- Post content -->
                <p class="post-body">
                    {{ post[1] }}
                </p>
            
                <span class="happiness">🌦️ Great</span>
            
                <!-- Interactions -->
                <div class="post-actions">
            
                    <button type="button" class="post-action" >
                        {{post[3]}} Happiness
                    </button>
            
                    <a class="post-action" href="{{ url_for('post_page', post_id=post[0]) }}">
                      {{post[4]}} Comments
                    </a>
            
                </div>
            
            </article>

          {% endfor %}
        </section>


    </main>


</div>

<script>
  function increaseHappiness() {

  }
</script>

{% endblock %}
