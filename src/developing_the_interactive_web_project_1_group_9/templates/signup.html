
{% extends "template.html" %}

{% block body %}
<body>



    <div id="layout" class="pure-g">
        <div class="sidebar pure-u-1 pure-u-md-1-4">
            <div class="header">
                <h1 class="brand-title">Sunshine!</h1>
                <h2 class="brand-tagline">Adding one smile at a time! </h2>

            </div>
        </div>

        <div class="content pure-u-1 pure-u-md-1-2">
            <div>


                <div class="posts">
                    <h1 class="content-subhead">Wanna Join the fun? Sign up!</h1>

                    <section class="post">
                        <header class="post-header">
                            <h1 class="post-title">Sign Up</h1>
                            <p class="post-meta">
                                Embark on a new way of <a class="post-category post-category-js" href="#">Fun</a>
                            </p>
                        </header>

                        <div class="post-description">
                            <p>
                                <label for="email">Email</label>
                                <input id="email" name="email" type="text" />
                                <br>
                                <label for="signup_username">Username</label>
                                <input id="signup_username" name="signup_username type=" text" />
                                <br>
                                <label for="signup_password">Password</label>
                                <input id="signup_password" name="signup_password" type="text" />
                                <button>Sign Up</button>

                            </p>
                        </div>
                    </section>

                    <section class="post">
                        <header class="post-header">
                            <img width="48" height="48" alt="Reid Burke&#x27;s avatar" class="post-avatar"
                                src="/img/common/reid-avatar.png">

                            <h2 class="post-title">Trending Posts</h2>

                            <p class="post-meta">
                                By <a class="post-author" href="#">Reid Burke</a> under <a class="post-category"
                                    href="#">Enjoy</a> Monday, Oct 21st 9:00am
                            </p>
                        </header>

                        <div class="post-description">
                            <div class="post-images pure-g">
                                <div class="pure-u-1 pure-u-md-1-2">
                                    <a href="http://www.flickr.com/photos/uberlife/8915936174/">
                                        <img alt="Photo of someone working poolside at a resort"
                                            class="pure-img-responsive"
                                            src="http://farm8.staticflickr.com/7448/8915936174_8d54ec76c6.jpg">
                                    </a>

                                    <div class="post-image-meta">
                                        <h3>Belgium</h3>
                                    </div>
                                </div>

                                <div class="pure-u-1 pure-u-md-1-2">
                                    <a href="http://www.flickr.com/photos/uberlife/8907351301/">
                                        <img alt="Photo of the sunset on the beach" class="pure-img-responsive"
                                            src="http://farm8.staticflickr.com/7382/8907351301_bd7460cffb.jpg">
                                    </a>

                                    <div class="post-image-meta">
                                        <h3>Miami</h3>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>
                </div>
            </div>
        </div>
    </div>

</body>

{% endblock %}
