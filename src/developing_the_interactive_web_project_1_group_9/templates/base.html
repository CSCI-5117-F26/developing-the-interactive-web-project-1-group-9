<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Sunshine{% endblock %}</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/purecss@3.1.0/build/pure-min.css"
        integrity="sha384-kj0X2NG2KHBie8Tq8fH1kxnyWM9XsXQpq7XdwbKmFKjwwaXGKBlB2Klu3VOltSFx" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/purecss@3.1.0/build/grids-responsive-min.css" />
    <link rel="stylesheet" href="{{url_for('static', filename='/style.css')}}">

</head>

<body>
  <!-- Header -->
  <div class="page feed">
    <header class="topbar">
      <a href="/profile" class="btn btn-primary">My Profile</a>
      <a href="/feeds" class="btn btn-primary">Main feed</a>

      <form class="pure-form" role="search">
          <input class="search" type="search" placeholder="Search people and posts">
      </form>
    </header>
  </div>
    {% block content %}
    {% endblock %}
</body>

</html>
